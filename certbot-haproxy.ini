# Certbot configuration for haproxy-authenticator
# This file ensures consistent configuration across installations

# Use haproxy authenticator and installer by default
authenticator = haproxy-authenticator
installer = haproxy-installer

# Set HTTP-01 port to 8000 (HAProxy forwards from port 80)
http01-port = 8000
haproxy-authenticator-haproxy-http-01-port = 8000

# Deploy hook for automatic certificate deployment
deploy-hook = /usr/bin/certbot-haproxy-deploy

# Recommended: Use ECDSA keys for better performance
key-type = ecdsa
elliptic-curve = secp256r1

# Server configuration
server = https://acme-v02.api.letsencrypt.org/directory
