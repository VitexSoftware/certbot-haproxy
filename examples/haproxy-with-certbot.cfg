# Example HAProxy Configuration for certbot-haproxy
#
# This configuration demonstrates how to properly set up HAProxy to work with
# the certbot-haproxy plugin for automated Let's Encrypt certificate management.
#
# Key points:
# - ACME challenge ACL must come BEFORE other routing rules
# - Backend certbot should point to port 8000 (or your configured port)
# - SSL certificates should be loaded from /etc/haproxy/ssl/ directory
#

global
    # Basic global settings
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # SSL/TLS settings
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!aNULL:!MD5:!DSS
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout http-request 15s
    timeout http-keep-alive 15s
    
    # Logging
    option httplog
    option dontlognull
    option log-separate-errors
    option log-health-checks
    
    # Error pages
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# HTTP Frontend (Port 80)
frontend http-in
    bind *:80
    
    # ACME Challenge Handling - MUST COME FIRST!
    # This ACL matches Let's Encrypt challenge requests
    acl is_certbot path_beg -i /.well-known/acme-challenge
    use_backend certbot if is_certbot
    
    # Security headers for HTTP
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    
    # Optional: Redirect HTTP to HTTPS (uncomment if you want HTTPS-only)
    # redirect scheme https code 301 if !{ ssl_fc }
    
    # Default backend for HTTP traffic
    default_backend web_servers

# HTTPS Frontend (Port 443)
frontend https-in
    # Load all certificates from /etc/haproxy/ssl/
    # certbot-haproxy-deploy will place certificates here
    bind *:443 ssl crt /etc/haproxy/ssl/
    
    # Security headers for HTTPS
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    
    # Forward client IP to backend servers
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]
    
    # Default backend for HTTPS traffic
    default_backend web_servers

# Backend for Let's Encrypt ACME Challenges
backend certbot
    mode http
    
    # This server points to where certbot-haproxy authenticator listens
    # Default port is 8000, but can be changed with:
    # --haproxy-authenticator-haproxy-http-01-port <port>
    server certbot 127.0.0.1:8000 check

# Backend for your web servers
backend web_servers
    mode http
    balance roundrobin
    
    # Health check configuration
    option httpchk GET /health
    http-check expect status 200
    
    # Server configuration - adjust as needed
    server web1 127.0.0.1:8080 check weight 100 maxconn 100
    server web2 127.0.0.1:8081 check weight 100 maxconn 100
    
    # Optional: Enable session stickiness if needed
    # cookie SERVERID insert indirect nocache
    # server web1 127.0.0.1:8080 check cookie web1
    # server web2 127.0.0.1:8081 check cookie web2

# Optional: Statistics page
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    
    # Optional: Add authentication
    # stats auth admin:password

#
# Usage with certbot-haproxy:
#
# 1. Install certificates:
#    certbot certonly \
#      --authenticator haproxy-authenticator \
#      --haproxy-authenticator-haproxy-http-01-port 8000 \
#      --deploy-hook /usr/bin/certbot-haproxy-deploy \
#      -d example.com -d www.example.com
#
# 2. Set up automatic renewal:
#    echo "0 2 * * * root /usr/bin/certbot renew -q --deploy-hook /usr/bin/certbot-haproxy-deploy --post-hook 'systemctl reload haproxy'" > /etc/cron.d/certbot-haproxy
#
# 3. Validate configuration:
#    haproxy -c -f /etc/haproxy/haproxy.cfg
#
# 4. Reload HAProxy:
#    systemctl reload haproxy
#
# Directory structure after deployment:
# /etc/haproxy/ssl/
# ├── example.com.pem        # Combined private key + fullchain
# ├── www.example.com.pem    # Combined private key + fullchain
# └── ...
#
# Each .pem file contains:
# 1. Private key
# 2. Certificate
# 3. Intermediate certificates
# 4. Root certificate (fullchain)
#